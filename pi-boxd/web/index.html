<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>pi-box · 多 Agent 平台</title>
  <link rel="icon" id="app-favicon" type="image/svg+xml" href="/favicon.svg">
  <!-- 代码高亮主题必须排在 style.css 之前，方便 style.css 覆盖内边距/滚动行为 -->
  <link rel="stylesheet" href="/vendor/hljs.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>pi-box</h1>
    <div id="status-bar" class="status"></div>
    <span id="sse-indicator" class="sse-indicator sse-ok" title="SSE 已连接">🟢</span>
    <button id="open-settings" title="系统设置（模型 / Skills / MCP / 系统）">⚙ 设置</button>
  </header>

  <nav id="mobile-nav" class="mobile-nav" aria-label="移动端主导航">
    <button type="button" data-mobile-panel="tree">📁<span>项目</span></button>
    <button type="button" data-mobile-panel="sessions">💬<span>会话</span></button>
    <button type="button" data-mobile-panel="view">✍️<span>对话</span></button>
    <button type="button" data-mobile-panel="tasks">🧭<span>任务</span></button>
  </nav>

  <div id="settings-modal" class="modal hidden" aria-label="系统设置">
    <div class="modal-content modal-settings">
      <div class="modal-head">
        <h2>系统设置</h2>
        <button id="close-settings" class="close-btn" type="button">×</button>
      </div>
      <div class="modal-body modal-settings-body">
        <nav id="drawer-nav" class="drawer-nav">
          <button class="drawer-nav-item active" data-tab="models" type="button">🤖 模型</button>
          <button class="drawer-nav-item" data-tab="agents" type="button">🌐 Agents</button>
          <button class="drawer-nav-item" data-tab="skills" type="button">📚 Skills</button>
          <button class="drawer-nav-item" data-tab="mcp" type="button">🔌 MCP</button>
          <button class="drawer-nav-item" data-tab="cleanup" type="button">🧹 数据清理</button>
          <button class="drawer-nav-item" data-tab="system" type="button">⚙ 系统</button>
        </nav>
        <section id="drawer-content" class="drawer-content">
          <!-- 模型 Tab：左侧提供商二级菜单 + 右侧配置区 -->
          <div id="tab-models" class="drawer-tab">
            <div class="provider-layout">
              <nav class="provider-nav">
                <div id="provider-tabs" class="provider-tabs"></div>
                <div id="add-provider-panel" class="provider-add-panel hidden"></div>
                <button id="add-provider" class="provider-add" type="button">＋ 添加提供商</button>
              </nav>
              <div class="provider-panel">
                <div id="provider-form" class="provider-form hidden">
                  <div class="provider-form-head">
                    <h3 id="provider-form-title">提供商</h3>
                    <label class="cfg-inline"><input id="cfg-active" type="checkbox"> 设为全局默认</label>
                  </div>
                  <div class="form-row"><label for="cfg-key">API Key</label><input id="cfg-key" type="password" placeholder="未改动时留空保留原 key"></div>
                  <div class="form-row"><label for="cfg-baseurl">Base URL</label><input id="cfg-baseurl" type="text" placeholder="可选"></div>
                  <div class="form-row cfg-models-row">
                    <label>已配置模型</label>
                    <div class="cfg-models">
                      <div id="cfg-models-chips" class="cfg-models-chips"></div>
                      <div class="cfg-models-add">
                        <input id="cfg-model-add" type="text" placeholder="模型 ID，如 deepseek-flash" />
                        <button id="cfg-model-add-btn" class="btn-secondary" type="button">添加</button>
                      </div>
                      <div class="cfg-models-catalog">
                        <div class="cfg-models-catalog-head">
                          <span class="muted">可用模型目录</span>
                          <button id="fetch-models" class="btn-secondary" type="button">获取可用模型</button>
                        </div>
                        <select id="cfg-model-select" size="6"></select>
                        <div class="cfg-models-catalog-actions">
                          <button id="cfg-model-pick" class="btn-secondary" type="button">添加选中项</button>
                        </div>
                      </div>
                    </div>
                  </div>
                  <div id="cfg-status" class="form-status"></div>
                  <div class="form-actions">
                    <span class="modal-hint">每个提供商的配置与模型列表分别持久保存</span>
                    <button id="cfg-delete" class="btn-secondary" type="button">删除此提供商</button>
                    <button id="test-settings" class="btn-secondary" type="button">测试连接</button>
                    <button id="save-settings" type="button">保存</button>
                  </div>
                </div>
                <div id="provider-empty" class="provider-empty muted">← 从左侧选择或添加提供商</div>
              </div>
            </div>
          </div>
          <div id="tab-agents" class="drawer-tab hidden"></div>
          <div id="tab-skills" class="drawer-tab hidden"></div>
          <div id="tab-mcp" class="drawer-tab hidden"></div>
          <div id="tab-cleanup" class="drawer-tab hidden"></div>
          <div id="tab-system" class="drawer-tab hidden"></div>
        </section>
      </div>
    </div>
  </div>

  <main>
    <section id="panel-tree">
      <div class="panel-head">
        <h2>项目</h2>
        <button id="new-project" title="新建项目（建目录 + 项目助理）">+ 新建项目</button>
      </div>
      <div id="tree" class="scroll"></div>
    </section>

    <section id="panel-sessions">
      <div class="panel-head">
        <h2 id="sessions-title">会话</h2>
        <div class="panel-head-actions">
          <button id="file-upload-btn" type="button" hidden title="上传文件到当前目录">⬆ 上传</button>
          <button id="new-conversation" type="button" disabled>＋ 新建会话</button>
        </div>
      </div>
      <div id="session-list" class="scroll"></div>
    </section>

    <section id="panel-view">
      <div id="view"></div>
    </section>

    <section id="panel-tasks">
      <div class="panel-head">
        <h2 id="tasks-title">任务图 <small>当前会话</small></h2>
        <div class="panel-head-actions">
          <a id="file-download-btn" class="panel-link" hidden download>⬇ 下载</a>
          <button id="file-refresh-btn" type="button" hidden title="重新读取预览">↻</button>
        </div>
      </div>
      <div id="task-graph" class="scroll"></div>
    </section>
  </main>

  <input id="file-upload-input" type="file" multiple hidden>

  <script src="/vendor/hljs.js"></script>
  <script src="/app.js"></script>
</body>
</html>

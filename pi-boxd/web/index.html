<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>pi-box · 多 Agent 平台</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>pi-box</h1>
    <div id="status-bar" class="status"></div>
    <button id="open-settings" title="模型设置">⚙ 设置</button>
  </header>

  <div id="settings-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-head">
        <h2>模型设置</h2>
        <button id="close-settings" class="close-btn" type="button">×</button>
      </div>
      <div class="modal-body">
        <div class="form-row"><label for="cfg-provider">Provider</label><select id="cfg-provider"></select></div>
        <div class="form-row"><label for="cfg-model">Model ID</label><select id="cfg-model"></select></div>
        <div class="form-row"><label for="cfg-key">API Key</label><input id="cfg-key" type="password" placeholder="未改动时留空保留原 key"></div>
        <div class="form-row"><label for="cfg-baseurl">Base URL</label><input id="cfg-baseurl" type="text" placeholder="可选"></div>
        <div id="cfg-status" class="form-status"></div>
      </div>
      <div class="modal-foot"><button id="save-settings" type="button">保存</button></div>
    </div>
  </div>

  <main>
    <section id="panel-tree">
      <div class="panel-head">
        <h2>项目</h2>
        <button id="new-project" title="新建项目（建目录 + 项目助理）">+ 新建项目</button>
      </div>
      <div id="tree" class="scroll"></div>
    </section>

    <section id="panel-view">
      <div id="view"></div>
    </section>

    <section id="panel-tasks">
      <div class="panel-head"><h2>任务图 <small>live task</small></h2></div>
      <div id="task-graph" class="scroll"></div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>

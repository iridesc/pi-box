services:
  pi:
    build: .
    container_name: pi-box
    restart: unless-stopped
    ports:
      # pi-boxd 管理台：127.0.0.1:8790 → 容器 8790
      - "127.0.0.1:8790:8790"
    volumes:
      # 工作区：项目文件、项目/全局 Agent 与项目定时任务配置
      - ./workspace:/workspace
      # 应用 HOME：Durable SQLite、模型/MCP 配置、用户 Skills 与会话数据
      - ./agent-home:/home/agent
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - PI_BOXD_DATA_DIR=/home/agent/.pi-boxd
      - PORT=8790
      # 应用层 HTTP Basic Auth；密码为空时仅适合本地开发。
      - PI_BOX_AUTH_USERNAME=${PI_BOX_AUTH_USERNAME:-pi}
      - PI_BOX_AUTH_PASSWORD=${PI_BOX_AUTH_PASSWORD:-}
    env_file:
      - path: .env
        required: false

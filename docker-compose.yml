services:
  pi:
    build: .
    container_name: pi-box
    restart: unless-stopped
    ports:
      # pi-boxd 管理台：127.0.0.1:8790 → 容器 8790
      - "127.0.0.1:8790:8790"
    volumes:
      # 工作区：用户项目（每个子目录 = 一个项目）+ .cron/ 任务配置
      - ./workspace:/workspace
      # pi-boxd 持久数据：会话/任务（SQLite）、模型配置、全局 agent 库
      - ./agent-data:/home/agent/.pi-boxd
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      # pi-boxd 配置
      - PI_BOX_WORKSPACE=/workspace
      - PI_BOXD_DATA_DIR=/home/agent/.pi-boxd
      - PI_BOXD_WEB_DIR=/home/pi-boxd/app/web
      - PORT=8790
    env_file:
      - path: .env
        required: false
